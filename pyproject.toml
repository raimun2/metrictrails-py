[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metrictrails"
version = "1.0.0"
description = "Processing of GNSS streams from sports watches. Python port of the R package metrictrails (CRAN)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Raimundo Sanchez", email = "raimundosanchezu@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyproj>=3.5"]

[project.optional-dependencies]
dem = ["rasterio>=1.3"]
test = ["pytest>=7", "rasterio>=1.3"]

[project.urls]
Homepage = "https://metrictrails.com"
Source = "https://github.com/raimun2/metrictrails-py"
"R package" = "https://github.com/raimun2/metrictrails"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metrictrails = ["extdata/*"]

[tool.metrictrails]
r_version = "1.0.0"
r_commit = "ac1c9ee"
